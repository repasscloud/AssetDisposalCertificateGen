name: Build & Deploy to GitHub Pages

# ── Triggers ────────────────────────────────────────────────────────────────
on:
  push:
    branches: [main]
  workflow_dispatch:          # allow manual runs from the Actions tab

# ── Top-level permissions (GitHub Pages OIDC deployment) ────────────────────
permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment may run at a time; never cancel an in-progress
# deploy (let it finish so the site is never left in a broken state).
concurrency:
  group: pages
  cancel-in-progress: false

# ── Shared config ────────────────────────────────────────────────────────────
env:
  NODE_VERSION: "22"

# ── Jobs ─────────────────────────────────────────────────────────────────────
jobs:

  # ── 1. Build ───────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm           # caches the npm download cache (~/.npm)

      - name: Install dependencies
        run: npm ci

      # tsc runs in noEmit mode (see tsconfig.json) — catches type errors
      # before vite build starts, giving a faster, clearer failure signal.
      - name: Type-check
        run: npx tsc --noEmit

      # VITE_BASE sets the Vite base path to /<repo-name>/ so that all
      # asset URLs resolve correctly on the GitHub Pages project-site
      # sub-path.  On a personal/org site (repo = <user>.github.io) you
      # can override this to "/" via a repository variable.
      - name: Build
        run: npm run build
        env:
          VITE_BASE: ${{ vars.PAGES_BASE_PATH || format('/{0}/', github.event.repository.name) }}

      # actions/upload-pages-artifact automatically adds .nojekyll so that
      # GitHub Pages' Jekyll processor doesn't interfere with Vite's output.
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # ── 2. Deploy ──────────────────────────────────────────────────────────────
  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest

    # Scoped permissions — deploy job only needs to write to Pages.
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
