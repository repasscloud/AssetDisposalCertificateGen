name: Build & Deploy to Cloudflare Pages

# ── Triggers ────────────────────────────────────────────────────────────────
on:
  push:
    branches: [main]
  workflow_dispatch:

# ── Permissions ─────────────────────────────────────────────────────────────
permissions:
  contents: read

# ── Shared config ────────────────────────────────────────────────────────────
env:
  NODE_VERSION: "22"

# ── Jobs ─────────────────────────────────────────────────────────────────────
jobs:

  # ── 1. Build ────────────────────────────────────────────────────────────────
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # tsc runs in noEmit mode — catches type errors before vite build starts.
      - name: Type-check
        run: npx tsc --noEmit

      # VITE_BASE defaults to "/" in vite.config.ts (custom subdomain = root).
      # Override here only if you ever need a non-root base path.
      - name: Build
        run: npm run build

      # ── Deploy to Cloudflare Pages ──────────────────────────────────────────
      # Requires two repository secrets:
      #   CLOUDFLARE_API_TOKEN  — an API token with "Cloudflare Pages: Edit" permission
      #   CLOUDFLARE_ACCOUNT_ID — your Cloudflare account ID (found in the dashboard sidebar)
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=asset-disposal-cergen --commit-dirty=true
