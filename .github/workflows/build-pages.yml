name: Build & Deploy to Cloudflare Pages

# ── Triggers ────────────────────────────────────────────────────────────────
on:
  push:
    branches: [main]
  workflow_dispatch:

# ── Permissions ─────────────────────────────────────────────────────────────
permissions:
  contents: read

# ── Shared config ────────────────────────────────────────────────────────────
env:
  NODE_VERSION: "26"

# ── Jobs ─────────────────────────────────────────────────────────────────────
jobs:

  # ── 1. Build ────────────────────────────────────────────────────────────────
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Smoke test
        run: npm test

      # tsc runs in noEmit mode — catches type errors before vite build starts.
      - name: Type-check
        run: npx tsc --noEmit

      # VITE_BASE defaults to "/" in vite.config.ts (custom subdomain = root).
      # Override here only if you ever need a non-root base path.
      - name: Build
        run: npm run build

